services:
  local-db-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["initialize-local"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - CoffeeShopApi/.env
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - CoffeeShopApi/.env
    depends_on:
      local-db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_USE_STATIC_MENU: "false"
    ports:
      - "3000:80"
    env_file:
      - roast66/.env
    depends_on:
      - backend

  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_DB: coffeedb
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toor}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d coffeedb"]
      interval: 10s
      retries: 5

volumes:
  postgres-data:
