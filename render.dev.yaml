# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Developer-owned shared development Blueprint.
# Select this custom Blueprint path in the developer Render workspace.
# The existing roast66-api and roast66-web services are intentionally reused.

services:
  - type: web
    runtime: docker
    name: roast66-api
    plan: free
    region: oregon
    branch: dev
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Authentication__LegacySharedLoginEnabled
        value: "false"
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: Roast66Coffee
      - key: Jwt__Audience
        value: Roast66Coffee
      - key: Jwt__TokenExpiryInHours
        value: "8"
      - key: AllowedOrigins
        sync: false
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: ForwardedHeaders__ClientIpHeader
        value: CF-Connecting-IP
      - key: ForwardedHeaders__KnownProxies
        sync: false
      - key: ForwardedHeaders__KnownNetworks
        sync: false
      - key: ForwardedHeaders__ForwardLimit
        value: "1"
      - key: Order__DuplicateDetectionWindowMinutes
        value: "2"
      - key: Payments__DefaultProvider
        value: stripe
      - key: Payments__FrontendBaseUrl
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Notifications__SmsEnabled
        value: "false"
      - key: DataRetention__CompletedOrderHours
        value: "48"
      - key: DataRetention__OperationalLogDays
        value: "90"
      - key: DataRetention__BatchSize
        value: "100"
      - key: DataRetention__CheckIntervalMinutes
        value: "60"
      - key: DataRetention__RetryDelayMinutes
        value: "5"
      - key: Push__Subject
        value: mailto:support@example.com
      - key: Push__VapidPublicKey
        sync: false
      - key: Push__VapidPrivateKey
        sync: false
      - key: Resend__ApiKey
        sync: false
      - key: Resend__From
        sync: false
      - key: Support__AlertEmail
        sync: false

  - type: web
    runtime: static
    name: roast66-web
    branch: dev
    autoDeployTrigger: commit
    buildCommand: cd roast66 && npm ci && npm run build
    staticPublishPath: roast66/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_STATIC_MENU
        value: "false"
      - key: VITE_ENABLE_ONLINE_PAYMENTS
        value: "false"
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
