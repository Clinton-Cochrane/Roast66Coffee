# Roast66 Coffee - Render Blueprint
# Deploy: Connect this repo to Render and apply the Blueprint.
# Set secret env vars in the Render Dashboard after first deploy.

databases:
  - name: roast66-db
    databaseName: coffeedb
    plan: free

services:
  - type: web
    runtime: docker
    name: roast66-api
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health/ready
    preDeployCommand: dotnet CoffeeShopApi.dll migrate
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: roast66-db
          property: connectionString
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false
      # Release A compatibility only. Set false after named Owner verification.
      - key: Authentication__LegacySharedLoginEnabled
        value: "true"
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: Roast66Coffee
      - key: Jwt__Audience
        value: Roast66Coffee
      - key: Jwt__TokenExpiryInHours
        value: "8"
      - key: AllowedOrigins
        value: "https://roast66coffee-frontend.onrender.com"
        sync: false
      - key: Order__DuplicateDetectionWindowMinutes
        value: "2"
      - key: KeepAlive__Enabled
        value: "true"
      - key: KeepAlive__ProbeIntervalMinutes
        value: "4"
      - key: KeepAlive__ActiveWindowMinutes
        value: "10"
      - key: KeepAlive__SupabaseHeartbeatUrl
        sync: false
      - key: KeepAlive__SupabaseServiceRoleKey
        sync: false
      - key: Payments__DefaultProvider
        value: "stripe"
      - key: Payments__FrontendBaseUrl
        value: "https://roast66coffee-frontend.onrender.com"
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Notifications__SmsEnabled
        value: "false"
      - key: DataRetention__CompletedOrderHours
        value: "30"
      - key: DataRetention__OperationalLogDays
        value: "90"
      - key: DataRetention__BatchSize
        value: "100"
      - key: DataRetention__CheckIntervalMinutes
        value: "60"
      - key: DataRetention__RetryDelayMinutes
        value: "5"
      - key: Push__Subject
        value: "mailto:support@example.com"
      - key: Push__VapidPublicKey
        sync: false
      - key: Push__VapidPrivateKey
        sync: false
      - key: Resend__ApiKey
        sync: false
      - key: Resend__From
        sync: false
      - key: Support__AlertEmail
        sync: false

  - type: web
    name: roast66-web
    runtime: static
    buildCommand: cd roast66 && npm install && npm run build
    staticPublishPath: roast66/dist
    envVars:
      - key: VITE_API_URL
        value: "https://roast66coffee.onrender.com/api"
        sync: false
      # Set to "true" to enable the configured payment provider; rebuild the static site after changing.
      - key: VITE_ENABLE_ONLINE_PAYMENTS
        value: "false"
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
