server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  location = / {
    try_files /index.html =404;
  }

  # Direct visits must receive each page's HTML before React starts.
  location ~* ^/about/?$ {
    try_files /about.html =404;
  }

  location ~* ^/menu/?$ {
    try_files /menu.html =404;
  }

  location ~* ^/order/?$ {
    try_files /order.html =404;
  }

  # A missing script, image or crawl file must never return an app document.
  location ~* \.(js|css|map|json|xml|txt|svg|ico|png|jpe?g|webp|avif|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html /app.html;
  }
}
