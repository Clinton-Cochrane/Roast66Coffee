# Continuous integration: backend and frontend tests on every push and PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Verify coverage reporting
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

      - name: Restore, audit, and test with application coverage
        run: |
          dotnet restore Roast66.sln \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            '-warnaserror:NU1901;NU1902;NU1903;NU1904'
          dotnet list "$GITHUB_WORKSPACE/Roast66.sln" package \
            --vulnerable \
            --include-transitive
          scripts/ci/with-postgres.sh dotnet test Roast66.sln \
            --no-restore \
            --configuration Release \
            --verbosity minimal \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/backend

      - name: Publish and enforce backend coverage
        run: python3 scripts/ci/backend_coverage.py TestResults/backend

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: TestResults/backend/**/coverage.cobertura.xml
          if-no-files-found: error

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node npm cache restore/save
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: roast66/package-lock.json

      - name: Install, test, lint, and build
        working-directory: roast66
        env:
          CI: true
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high

  release-contracts:
    name: Render release contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Check out deployment baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: candidate/roast66/package-lock.json

      - name: Verify hosting configuration contracts
        working-directory: candidate
        run: scripts/ci/verify-hosting-config.sh

      - name: Install frontend and browser dependencies
        working-directory: candidate/roast66
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Upgrade the baseline with the candidate Render image and smoke-test the built menu
        run: |
          candidate/scripts/ci/render-smoke.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/base"

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-release-contract-browser-traces
          path: candidate/roast66/test-results
          if-no-files-found: ignore
