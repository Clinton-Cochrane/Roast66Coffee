# Continuous integration: backend and frontend tests on every push and PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_INTEGRATION_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      REQUIRE_POSTGRES_INTEGRATION_TESTS: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify coverage reporting
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

      - name: Restore and test with application coverage
        run: |
          dotnet restore Roast66.sln
          dotnet test Roast66.sln \
            --configuration Release \
            --verbosity minimal \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/backend

      - name: Publish and enforce backend coverage
        run: |
          coverage_report=$(rg --files TestResults/backend | rg '/coverage\.cobertura\.xml$' | head -n 1)
          python3 scripts/ci/backend_coverage.py "$coverage_report"

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: TestResults/backend/**/coverage.cobertura.xml
          if-no-files-found: error

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # setup-node npm cache restore/save
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: roast66/package-lock.json

      - name: Install, test, lint, and build
        working-directory: roast66
        env:
          CI: true
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high

  release-contracts:
    name: Render release contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out deployment baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: candidate/roast66/package-lock.json

      - name: Install frontend and browser dependencies
        working-directory: candidate/roast66
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Upgrade the baseline with the candidate Render image and smoke-test the built menu
        run: |
          candidate/scripts/ci/render-smoke.sh \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/base"

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-release-contract-browser-traces
          path: candidate/roast66/test-results
          if-no-files-found: ignore
